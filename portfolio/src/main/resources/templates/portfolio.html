<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Portfolio</title>
</head>
<body>
    <!-- Este es el filtro para filtrar los proyectos por categoría -->
    <form>
        <select name="categoria" onchange="this.form.submit()">
            <option th:each="categoria, i : ${categorias}"
                    th:value="${categoria}"
                    th:text="${categoria}"
                    th:selected="${categoria.equals(categoriaSelec)}"></option>
        </select>
    </form>

    <!-- Este es el artículo de los proyectos tiene un título con el título y en un div un p por cada atributo -->
    <article th:if="${!proyectos.isEmpty()}"
            th:each="proyecto, i : ${proyectos}">
        <p>
            <strong th:text="${proyecto.getTitulo()}"></strong> --- <em th:text="${proyecto.getAno()}"></em>
        </p><br>

        <div>
            <p>Categoría: <em th:text="${proyecto.getCategoria()}"></em><br></p>
            <p>Estado: <em th:text="${proyecto.getEstado()}"></em><br></p>
            <p>Tecnologías: <em th:text="${proyecto.getTecnologias()}"></em></p><br>
            <p th:text="${proyecto.getDescripcion()}"></p>
            <p class="enlace" th:if="${proyecto.getEnlace() != null}"
                                th:text="${proyecto.getEnlace()}"></p>
            <img th:if="${proyecto.getUrlImagen()}"
                th:href="${proyecto.getUrlImagen()}">
        </div><br><br><br>
    </article>

    <h1 th:if="${proyectos.isEmpty()}">No hay resultados</h1>

    <a th:href="@{/portfolio/editar}">Editar</a><br>
    <a th:href="@{/}">volver</a>
</body>
</html>
