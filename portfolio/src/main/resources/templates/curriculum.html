<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Currículum Lope</title>

    <link rel="stylesheet" th:href="@{/estilos.css}">
</head>
<body>

    <div>
        <h1>Perfil:</h1>

        <p th:text="'Nombre: ' + ${cv.getNombre}"></p>
        <p th:text="'Descripción: ' + ${cv.getDescripcion}"></p>
        <p th:if="${!cv.getContacto().isBlank()}" th:text="'Contacto: ' + ${cv.getContacto()}"></p>
    </div>

    <div>
        <h1>Formación:</h1>

        <p th:each="dato, i : ${cv.getFormacion()}">
            <strong th:text="${dato.getTitulo()}"></strong> --- <em th:text="${dato.getDetalle()}"></em>
        </p>
    </div>

    <div>
        <h1>Experiencia:</h1>

        <p th:each="dato, i : ${cv.getExperiencia()}">
            <strong th:text="${dato.getTitulo()}"></strong> --- <em th:text="${dato.getDetalle()}"></em>
        </p>
    </div>

    <div>
        <h1>Habilidades:</h1>

        <p th:each="dato, i : ${cv.getHabilidades()}" th:switch="${dato.getDetalle()}">
            <strong th:text="${dato.getTitulo()}"></strong> ---
            <em th:case="'bajo'" th:class="nivel-bajo" th:text="${dato.getDetalle()}"></em>
            <em th:case="'medio'" th:class="nivel-medio" th:text="${dato.getDetalle()}"></em>
            <em th:case="'alto'" th:class="nivel-alto" th:text="${dato.getDetalle()}"></em>
        </p>
    </div>

    <div>
        <h1>Idiomas:</h1>

        <p th:each="dato, i : ${cv.getIdiomas()}" th:switch="${dato.getDetalle()}">
            <strong th:text="${dato.getTitulo()}"></strong> ---
            <em th:case="'A1'" th:class="nivel-bajo" th:text="${dato.getDetalle()}"></em>
            <em th:case="'A2'" th:class="nivel-bajo" th:text="${dato.getDetalle()}"></em>
            <em th:case="'B1'" th:class="nivel-medio" th:text="${dato.getDetalle()}"></em>
            <em th:case="'B2'" th:class="nivel-medio" th:text="${dato.getDetalle()}"></em>
            <em th:case="'C1'" th:class="nivel-alto" th:text="${dato.getDetalle()}"></em>
            <em th:case="'C2'" th:class="nivel-alto" th:text="${dato.getDetalle()}"></em>
            <em th:case="'Nativo'" th:class="nivel-alto" th:text="${dato.getDetalle()}"></em>
        </p>
    </div>

    <a th:href="@{/}">volver</a>
</body>
</html>
