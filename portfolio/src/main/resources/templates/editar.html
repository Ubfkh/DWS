<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
</head>
<body>
    <!-- Este es el formulario, que al enviarse llamará al PostMapping -->
    <form th:action="@{/portfolio/editar}" th:object="${form}" method="post">
        <!-- Estos tres primeros inputs son para el perfil, como valores iniciales tiene los guardados -->
        <label>Nombre:</label>
        <input type="text" name="nombre" th:value="${cv.getNombre()}"><br>

        <label>Descripción:</label>
        <input type="text" name="descripcion" th:value="${cv.getDescripcion()}"><br>

        <label>Contacto:</label>
        <input type="text" name="contacto" th:value="${cv.getContacto()}"><br>

        <!-- Hacemos lo mismo con la formación y la experiencia laboral -->
        <h2>Formación</h2>
        <div th:each="i : ${#numbers.sequence(0,4)}">
            <label>Estudios: </label>
            <input type="text" name="formacion" th:value="${i < cv.getFormacion().size() ? cv.getFormacion().get(i).getTitulo() : ''}">

            <label>Centro: </label>
            <input type="text" name="formacionDetalle" th:value="${i < cv.getFormacion().size() ? cv.getFormacion().get(i).getDetalle() : ''}">
        </div>

        <h2>Experiencia</h2>
        <div th:each="i : ${#numbers.sequence(0,4)}">
            <label>Empresa: </label>
            <input type="text" name="experiencia" th:value="${i < cv.getExperiencia().size() ? cv.getExperiencia().get(i).getTitulo() : ''}">

            <label>Rango de tiempo: </label>
            <input type="text" name="experienciaDetalle" th:value="${i < cv.getExperiencia().size() ? cv.getExperiencia().get(i).getDetalle() : ''}">
        </div>

        <!-- Las habilidades y los idiomas necesitan un select para elegir su nivel, no otro, pero las opciones vienen de un array del controlador -->
        <h2>Habilidades</h2>
        <div th:each="i : ${#numbers.sequence(0,4)}">
            <label>Habilidad: </label>
            <input type="text" name="habilidades" th:value="${i < cv.getHabilidades().size() ? cv.getHabilidades().get(i).getTitulo() : ''}">

            <label>Nivel: </label>
            <select name="habilidadesDetalle">
                <option th:each="n : ${nivelesHab}"
                        th:value="${n}"
                        th:text="${n}"
                        th:selected="${i < cv.getHabilidades().size() ? n.equals(cv.getHabilidades().get(i).getDetalle()) : ''}"></option>
            </select>
        </div>

        <h2>Idiomas</h2>
        <div th:each="i : ${#numbers.sequence(0,4)}">
            <label>Idioma: </label>
            <input type="text" name="idiomas" th:value="${i < cv.getIdiomas().size() ? cv.getIdiomas().get(i).getTitulo() : ''}">

            <label>Nivel: </label>
            <select name="idiomasDetalle">
                <option th:each="n : ${nivelesId}"
                        th:value="${n}"
                        th:text="${n}"
                        th:selected="${i < cv.getIdiomas().size() ? n.equals(cv.getIdiomas().get(i).getDetalle()) : ''}"></option>
            </select>
        </div>

        <!-- Esto añade una serie de inputs para cada proyecto, uno por cada atributo del mismo. Con los selects se hace lo mismo que en habilidades e idiomas -->
        <h2>Proyectos</h2>
        <div th:each="proyecto, i : ${proyectos}">
            <label>Nombre: </label>
            <input type="text" name="proTitulo" th:value="${proyecto.getTitulo()}">

            <label>Año: </label>
            <input type="number" name="proAno" th:value="${proyecto.getAno()}">

            <label>Categoría: </label>
            <select name="proCategoria">
                <option th:each="c : ${categorias}"
                        th:value="${c}"
                        th:text="${c}"
                        th:selected="${proyecto.getCategoria()}"></option>
            </select>

            <label>Descripción: </label>
            <input type="text" name="proDescripcion" th:value="${proyecto.getDescripcion()}">

            <label>Estado: </label>
            <select name="proEstado">
                <option th:each="e : ${estados}"
                        th:value="${e}"
                        th:text="${e}"
                        th:selected="${proyecto.getEstado()}"></option>
            </select>

            <label>Tecnologías usadas: </label>
            <input type="text" name="proTecnologias" th:text="${proyecto.getTecnologias()}">

            <label>Enlace: </label>
            <input type="text" name="proEnlace" th:text="${proyecto.getEnlace()}">

            <label>Imagen: </label>
            <input type="text" name="proUrlImagen" th:text="${proyecto.getUrlImagen()}">

            <!-- El botón de borrar cambia el PostMapping al que se va a dirigir el formulario para poder usar otra lógica -->
            <button type="submit" name="indiceBorrar" th:value="${i.index}" th:formaction="@{/portfolio/borrarProyecto}">Borrar</button>
        </div>

        <!-- Este botón sirve para añadir un proyecto, sigue la misma lógica que el de borrar -->
        <button type="submit" th:formaction="@{/portfolio/anadirProyecto}"
                                th:if="${proyectos.size() < 5}">Añadir proyecto</button>

        <!-- El botón de guardar para guardar los cambios, siempre y cuando estén bien -->
        <button type="submit">Guardar</button>
    </form>
</body>
</html>
