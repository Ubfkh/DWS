
<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
</head>
<body>
<h1>Solicitud de préstamo</h1>

<form th:action="@{/solicitudes}"
      th:object="${solicitudForm}" method="post">

    <div class="campo">
        <label for="nombre">Nombre</label>
        <input id="nombre" type="text" th:field="*{nombre}"
               maxlength="60" required>
        <span class="error" th:errors="*{nombre}"></span>
    </div>

    <div class="campo">
        <label for="email">Correo electrónico</label>
        <input id="email" type="email" th:field="*{email}"
               maxlength="120" required>
        <span class="error" th:errors="*{email}"></span>
    </div>

    <div class="campo">
        <label for="material">Material solicitado</label>
        <select id="material" th:field="*{material}" required>
            <option value="">-- Selecciona un material --</option>
            <option th:each="m : ${materiales}"
                    th:value="${m[0]}"
                    th:text="${m[1]}"></option>
        </select>
        <span class="error" th:errors="*{material}"></span>
    </div>

    <div class="campo">
        <label for="cantidad">Unidades (1 a 3)</label>
        <input id="cantidad" type="number" th:field="*{cantidad}"
               min="1" max="3" step="1" required>
        <span class="error" th:errors="*{cantidad}"></span>
    </div>

    <div class="campo">
        <label for="fechaRecogida">Fecha de recogida</label>
        <input id="fechaRecogida" type="date"
               th:field="*{fechaRecogida}"
               th:attr="min=${hoy}" required>
        <span class="error" th:errors="*{fechaRecogida}"></span>
    </div>

    <div class="campo">
        <label for="fechaDevolucion">Fecha de devolución</label>
        <input id="fechaDevolucion" type="date"
               th:field="*{fechaDevolucion}"
               th:attr="min=${hoy}" required>
        <span class="error" th:errors="*{fechaDevolucion}"></span>
    </div>

    <div class="campo">
        <label for="motivo">Motivo del préstamo</label>
        <textarea id="motivo" th:field="*{motivo}"
                  minlength="30" maxlength="400"
                  rows="5" required></textarea>
        <span class="error" th:errors="*{motivo}"></span>
    </div>

    <div class="campo">
        <input id="normas" type="checkbox"
               th:field="*{normas}" required>
        <label for="normas">Acepto las normas del aula maker.</label>
        <span class="error" th:errors="*{normas}"></span>
    </div>

    <button type="submit">Enviar solicitud</button>
</form>

<p><a th:href="@{/}">Volver al catálogo</a></p>
</body>
</html>
